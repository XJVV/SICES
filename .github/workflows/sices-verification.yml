name: SICES verification
permissions:
  contents: write
on:
  pull_request:
  push:
    branches: [feature/sices-nasa-evolution]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run test:ingest
      - run: npm run db:setup
      - run: npm run db:curate
      - run: npm run build
      - run: npm run test:observatory
  ingest-data:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: python3 -m pip install -r python/requirements-batch.txt
      - run: npm run db:setup
      - run: npm run ingest:batch -- --root cvs
      - run: PYTHONPATH=python python3 -m sices.ingestion.curate --db db/custom.db --apply --vacuum
      - name: Publish curated SQLite to feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/sices-nasa-evolution'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/custom.db
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): refresh curated NASA PSI SQLite"
            git push origin HEAD:feature/sices-nasa-evolution
          fi
      - name: Upload SQLite and source audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sices-curated-sqlite
          path: |
            db/custom.db
            reports/batch-ingest.json
          if-no-files-found: warn
          retention-days: 7
